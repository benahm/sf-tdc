<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 15 112 112" role="img" aria-label="Technical Debt Collector">
  <!-- A cloud (Salesforce) with a coin cut out of it: the ring shows the background. -->
  <mask id="coin">
    <rect x="0" y="0" width="140" height="140" fill="#fff"/>
    <circle cx="72" cy="80" r="19" fill="#000"/>
    <circle cx="72" cy="80" r="13" fill="#fff"/>
    <rect x="69" y="70" width="6" height="20" rx="1" fill="#000"/>
    <rect x="64" y="70" width="16" height="5" rx="1" fill="#000"/>
  </mask>
  <g fill="#f0b429" mask="url(#coin)">
    <circle cx="44" cy="84" r="24"/>
    <circle cx="72" cy="66" r="32"/>
    <circle cx="100" cy="84" r="24"/>
    <rect x="44" y="84" width="56" height="24"/>
  </g>
</svg>
